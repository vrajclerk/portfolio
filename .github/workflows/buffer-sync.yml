name: Buffer LinkedIn Post Sync

on:
  schedule:
    # Runs at 09:00 and 15:00 UTC on Thursdays and Fridays (typical technical posting windows)
    - cron: '0 9,15 * * 4,5'
  workflow_dispatch:
    # Allows manual trigger with a single click from the GitHub Actions tab

concurrency:
  group: buffer-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Trigger Portfolio Buffer Ingestion
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger Sync API Endpoint
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::SITE_URL or CRON_SECRET GitHub Actions secret is not set."
            exit 1
          fi

          echo "Triggering Buffer post sync at ${SITE_URL}/api/sync/buffer..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "${SITE_URL}/api/sync/buffer" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json")

          HTTP_BODY=$(echo "$RESPONSE" | sed -e '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1 | cut -d':' -f2)

          echo "Response Body: $HTTP_BODY"
          echo "HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Buffer sync endpoint returned non-200 status ($HTTP_STATUS)"
            exit 1
          fi

